<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐍 Змейка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--a:#b56bff;--ad:#7d3fd1;--ag:rgba(181,107,255,.55);--ags:rgba(181,107,255,.14);--f:#ff6b9d;--fb:#150a26;--fg:rgba(255,255,255,.04);--b1:#0a0514;--b2:#1e0f38;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(22,12,40,.72);--pbd:rgba(181,107,255,.15);--to:#3a2a55}
body[data-theme=green]{--a:#00ff88;--ad:#00b866;--ag:rgba(0,255,136,.55);--ags:rgba(0,255,136,.14);--f:#ff3366;--fb:#0a0a1a;--fg:rgba(255,255,255,.04);--b1:#05050e;--b2:#12122a;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(14,14,32,.72);--pbd:rgba(255,255,255,.08);--to:#3a3a55}
body[data-theme=purple]{--a:#b56bff;--ad:#7d3fd1;--ag:rgba(181,107,255,.55);--ags:rgba(181,107,255,.14);--f:#ff6b9d;--fb:#150a26;--fg:rgba(255,255,255,.04);--b1:#0a0514;--b2:#1e0f38;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(22,12,40,.72);--pbd:rgba(181,107,255,.15);--to:#3a2a55}
body[data-theme=orange]{--a:#ffaa33;--ad:#cc7722;--ag:rgba(255,170,51,.55);--ags:rgba(255,170,51,.14);--f:#ff4466;--fb:#1a0d05;--fg:rgba(255,255,255,.04);--b1:#0d0603;--b2:#241205;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(26,15,8,.72);--pbd:rgba(255,170,51,.15);--to:#4a3520}
body[data-theme=blue]{--a:#33bbff;--ad:#1a88cc;--ag:rgba(51,187,255,.55);--ags:rgba(51,187,255,.14);--f:#ffaa00;--fb:#050e18;--fg:rgba(255,255,255,.04);--b1:#020810;--b2:#0a1828;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(6,18,32,.72);--pbd:rgba(51,187,255,.15);--to:#1a3550}
body[data-theme=pink]{--a:#ff6bb5;--ad:#cc3f88;--ag:rgba(255,107,181,.55);--ags:rgba(255,107,181,.14);--f:#ffee44;--fb:#170614;--fg:rgba(255,255,255,.04);--b1:#0c030a;--b2:#200c1c;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(28,10,26,.72);--pbd:rgba(255,107,181,.15);--to:#4a2040}
body[data-theme=dark]{--a:#b8b8c8;--ad:#7a7a8a;--ag:rgba(184,184,200,.5);--ags:rgba(184,184,200,.12);--f:#ff4444;--fb:#050505;--fg:rgba(255,255,255,.05);--b1:#000;--b2:#0a0a0a;--t:#fff;--td:rgba(255,255,255,.5);--pb:rgba(8,8,8,.85);--pbd:rgba(255,255,255,.08);--to:#2a2a2a}
body[data-theme=light]{--a:#00a050;--ad:#007a3c;--ag:rgba(0,160,80,.4);--ags:rgba(0,160,80,.12);--f:#dd2244;--fb:#eef0f5;--fg:rgba(0,0,0,.06);--b1:#f7f8fc;--b2:#d8dce8;--t:#0a0a14;--td:rgba(10,10,20,.55);--pb:rgba(255,255,255,.85);--pbd:rgba(0,0,0,.08);--to:#b0b4c0}
body[data-theme=silver]{--a:#d0d0e0;--ad:#8a8a9a;--ag:rgba(208,208,224,.6);--ags:rgba(208,208,224,.15);--f:#ff5588;--fb:#15151e;--fg:rgba(255,255,255,.05);--b1:#08080f;--b2:#1a1a28;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(20,20,32,.72);--pbd:rgba(208,208,224,.2);--to:#3a3a4a}
body[data-theme=ruby]{--a:#ff3355;--ad:#a01830;--ag:rgba(255,51,85,.65);--ags:rgba(255,51,85,.18);--f:#ffaa33;--fb:#1a0508;--fg:rgba(255,51,85,.1);--b1:#0a0205;--b2:#250810;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(28,8,12,.75);--pbd:rgba(255,51,85,.25);--to:#4a1a25}
body[data-theme=emerald]{--a:#00dd77;--ad:#008844;--ag:rgba(0,221,119,.6);--ags:rgba(0,221,119,.16);--f:#ff4466;--fb:#051a10;--fg:rgba(0,221,119,.08);--b1:#020a06;--b2:#082a18;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(8,28,18,.75);--pbd:rgba(0,221,119,.25);--to:#1a4a30}
body[data-theme=carbon]{--a:#00ddff;--ad:#0099bb;--ag:rgba(0,221,255,.6);--ags:rgba(0,221,255,.16);--f:#ff6600;--fb:#0a0a0a;--fg:rgba(0,221,255,.1);--b1:#000;--b2:#0f0f0f;--t:#fff;--td:rgba(255,255,255,.55);--pb:rgba(10,10,10,.9);--pbd:rgba(0,221,255,.25);--to:#2a2a2a}
body[data-theme=cosmic]{--a:#cc66ff;--ad:#8833cc;--ag:rgba(204,102,255,.75);--ags:rgba(204,102,255,.22);--f:#ffee44;--fb:#0a0420;--fg:rgba(204,102,255,.12);--b1:#050210;--b2:#150830;--t:#fff;--td:rgba(255,255,255,.6);--pb:rgba(15,8,35,.85);--pbd:rgba(204,102,255,.3);--to:#2a1a4a}
body[data-theme=rainbow]{--a:#ff3388;--ad:#aa1155;--ag:rgba(255,51,136,.65);--ags:rgba(255,51,136,.18);--f:#33ff88;--fb:#1a0822;--fg:rgba(255,255,255,.05);--b1:#0a0212;--b2:#200a2e;--t:#fff;--td:rgba(255,255,255,.6);--pb:rgba(25,10,35,.78);--pbd:rgba(255,51,136,.3);--to:#3a1a44}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--b1);background-image:radial-gradient(ellipse 80% 60% at 50% 0,var(--ags),transparent 70%),radial-gradient(ellipse 60% 50% at 80% 100%,var(--ags),transparent 70%),linear-gradient(135deg,var(--b1),var(--b2));color:var(--t);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .6s,color .3s;position:relative}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;background:var(--a);opacity:.35;filter:blur(1px);animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0) rotate(0);opacity:0}10%{opacity:.4}90%{opacity:.4}100%{transform:translateY(-10vh) scale(1) rotate(360deg);opacity:0}}
.tp{position:absolute;pointer-events:none;animation:tFall linear infinite}
@keyframes tFall{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.side-crystals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.side-crystal{position:absolute;opacity:.25;animation:cPulse 4s ease-in-out infinite}
@keyframes cPulse{0%,100%{opacity:.2;transform:scale(1) rotate(0)}50%{opacity:.5;transform:scale(1.15) rotate(15deg)}}
.screen{display:none;width:100%;max-width:1100px;padding:16px;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;max-height:100vh;overflow-y:auto}
.screen.active{display:flex;animation:scrIn .5s cubic-bezier(.34,1.4,.64,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.menu-panel{position:relative;width:100%;max-width:440px;padding:34px 26px 24px;border-radius:32px;background:var(--pb);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--pbd);box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 80px -20px rgba(0,0,0,.7),0 0 80px -15px var(--ag);text-align:center;max-height:calc(100vh - 32px);overflow-y:auto}
.top-corners{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:5}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.05);border:1.5px solid var(--pbd);color:var(--t);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);padding:0;font-family:inherit;line-height:1}
.icon-btn:hover{background:var(--ags);border-color:var(--a);color:var(--a);transform:rotate(60deg);box-shadow:0 0 20px var(--ag)}
.icon-btn.stats:hover{transform:scale(1.1)}
.corner{position:absolute;width:18px;height:18px;border-color:var(--a);pointer-events:none;opacity:.6}
.corner.tl{top:16px;left:16px;border-top:2px solid;border-left:2px solid;border-top-left-radius:8px}
.corner.bl{bottom:16px;left:16px;border-bottom:2px solid;border-left:2px solid;border-bottom-left-radius:8px}
.corner.br{bottom:16px;right:16px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:8px}
.logo-wrap{width:72px;height:72px;margin:0 auto 10px;position:relative;display:flex;align-items:center;justify-content:center}
.logo-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);box-shadow:0 0 20px var(--ag),inset 0 0 20px var(--ags);animation:ringPulse 2.5s ease-in-out infinite}
.logo-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1px dashed var(--a);opacity:.4;animation:spin 12s linear infinite reverse}
@keyframes ringPulse{0%,100%{transform:scale(1);box-shadow:0 0 20px var(--ag),inset 0 0 20px var(--ags)}50%{transform:scale(1.05);box-shadow:0 0 35px var(--ag),inset 0 0 25px var(--ags)}}
.logo-snake{font-size:2.5rem;line-height:1;filter:drop-shadow(0 0 15px var(--ag));animation:sway 3s ease-in-out infinite;z-index:2}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.menu-panel h1{font-size:2.2rem;font-weight:900;letter-spacing:5px;margin:0 0 12px;background:linear-gradient(180deg,var(--t) 20%,var(--a) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.top-stats{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:50px;background:rgba(255,255,255,.05);border:1.5px solid var(--pbd);font-weight:700;font-size:.85rem}
.stat-chip.gold{background:linear-gradient(135deg,rgba(255,200,0,.14),rgba(255,160,0,.05));border-color:rgba(255,200,0,.35);color:#ffd25e;box-shadow:0 0 20px rgba(255,200,0,.15)}
.stat-chip.coins{background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,180,0,.08));border-color:rgba(255,215,0,.5);color:#ffd700;box-shadow:0 0 24px rgba(255,215,0,.25)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 24px;border:none;border-radius:16px;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--a),var(--ad));color:#000;font-size:1.2rem;padding:16px 26px;box-shadow:0 8px 24px -4px var(--ag);margin-bottom:10px}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);transition:transform .7s}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 34px -6px var(--ag)}
.btn-secondary{background:rgba(255,255,255,.05);border:1.5px solid var(--pbd);color:var(--t);font-size:.94rem;padding:12px 20px}
.btn-secondary:hover{background:var(--ags);border-color:var(--a);transform:translateY(-2px);box-shadow:0 0 24px var(--ag)}
.btn-skins{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 20px;background:linear-gradient(135deg,rgba(255,200,0,.15),rgba(255,100,200,.1));border:1.5px solid rgba(255,200,0,.4);border-radius:16px;color:#ffd25e;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;transition:all .25s;margin-bottom:10px;position:relative;overflow:hidden}
.btn-skins::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:left .6s}
.btn-skins:hover::before{left:100%}
.btn-skins:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,200,0,.3);border-color:#ffd25e}
.btn-music{background:linear-gradient(135deg,rgba(180,100,255,.15),rgba(100,180,255,.1));border-color:rgba(180,100,255,.4);color:#cc88ff}
.btn-music:hover{box-shadow:0 8px 30px rgba(180,100,255,.3);border-color:#cc88ff}
.mode-section{margin-top:8px;padding-top:16px;border-top:1px solid var(--pbd)}
.mode-section-label{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--td);font-weight:700;margin-bottom:8px}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mode-btn{padding:10px 6px;border-radius:13px;background:rgba(255,255,255,.04);border:1.5px solid var(--pbd);color:var(--t);font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center}
.mode-btn .mode-icon{font-size:1rem;line-height:1}
.mode-btn:hover{border-color:var(--a);transform:translateY(-2px);box-shadow:0 0 16px var(--ags)}
.mode-btn.active{background:var(--ags);border-color:var(--a);box-shadow:0 0 20px var(--ags);color:var(--a)}
#gameScreen{max-width:1200px;padding:12px}

/* ====== ИГРОВОЙ LAYOUT: ЛЕГЕНДА | ИГРА | ПРОКАЧКИ ====== */
.game-layout{
  display:grid;
  grid-template-columns:210px minmax(0,1fr) 240px;
  gap:14px;
  width:100%;
  align-items:start;
  justify-content:center;
}
.game-column{display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px;margin:0 auto;min-width:0}

.legend-panel{display:flex;flex-direction:column;gap:8px;padding:14px 12px;border-radius:20px;background:var(--pb);backdrop-filter:blur(20px);border:1px solid var(--pbd);box-shadow:0 20px 50px -15px rgba(0,0,0,.6),0 0 40px -10px var(--ag);position:sticky;top:16px}
.legend-panel h3{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);font-weight:700;margin-bottom:4px}
.legend-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--pbd);transition:all .25s}
.legend-item:hover{border-color:var(--a);background:var(--ags)}
.legend-icon{font-size:1.3rem;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:8px;background:rgba(0,0,0,.3)}
.legend-text{font-size:.68rem;line-height:1.3;min-width:0}
.legend-text b{display:block;font-size:.74rem;color:var(--a);margin-bottom:2px;font-weight:800}
.legend-text span{color:var(--td);font-size:.6rem}

.upgrades-panel{display:none;flex-direction:column;gap:8px;padding:14px 12px;border-radius:20px;background:var(--pb);backdrop-filter:blur(20px);border:1px solid var(--pbd);box-shadow:0 20px 50px -15px rgba(0,0,0,.6),0 0 40px -10px var(--ag);position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.upgrades-panel.visible{display:flex}
.upgrades-panel::-webkit-scrollbar{width:4px}
.upgrades-panel::-webkit-scrollbar-thumb{background:var(--ag);border-radius:2px}
.upgrades-panel h3{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);font-weight:700;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.upgrades-panel h3 .up-coins{display:inline-flex;align-items:center;gap:4px;color:#ffd700;font-size:.85rem;font-weight:900;text-shadow:0 0 12px rgba(255,215,0,.6)}
.up-card{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1.5px solid var(--pbd);transition:all .25s}
.up-card:hover{border-color:var(--a);box-shadow:0 0 16px var(--ags)}
.up-card-title{font-size:.76rem;font-weight:800;color:var(--t);display:flex;align-items:center;justify-content:space-between;gap:4px}
.up-level{padding:1px 8px;background:var(--ags);border:1px solid var(--a);border-radius:10px;font-size:.6rem;font-weight:800;color:var(--a);white-space:nowrap}
.up-card-desc{font-size:.6rem;color:var(--td);line-height:1.3}
.up-buy{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 10px;background:linear-gradient(135deg,rgba(255,215,0,.2),rgba(255,180,0,.1));border:1.5px solid rgba(255,215,0,.5);border-radius:9px;color:#ffd700;font-family:inherit;font-weight:800;font-size:.72rem;cursor:pointer;transition:all .25s}
.up-buy:hover:not(:disabled){background:linear-gradient(135deg,rgba(255,215,0,.35),rgba(255,180,0,.2));box-shadow:0 0 20px rgba(255,215,0,.4);transform:translateY(-1px)}
.up-buy:disabled{opacity:.5;cursor:not-allowed}
.up-buy.free{background:linear-gradient(135deg,rgba(0,255,136,.25),rgba(0,200,100,.15));border-color:rgba(0,255,136,.6);color:#00ff88}

.top-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:4px 2px 12px;flex-wrap:wrap}
.stat-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:30px;background:var(--pb);backdrop-filter:blur(10px);border:1px solid var(--pbd);font-weight:700;font-size:.82rem}
.stat-pill.score{color:var(--a);border-color:var(--ags)}
.stat-pill.score .dot{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.stat-pill.coins{color:#ffd700;border-color:rgba(255,215,0,.35)}
.stat-pill.hiscore{color:#ffd25e;border-color:rgba(255,210,94,.25)}
.btn-menu{padding:8px 14px;border-radius:30px;background:var(--pb);backdrop-filter:blur(10px);border:1.5px solid var(--pbd);color:var(--t);font-family:inherit;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .25s;white-space:nowrap}
.btn-menu:hover{border-color:var(--a);color:var(--a);transform:translateY(-2px);box-shadow:0 0 20px var(--ags)}
.canvas-wrap{position:relative;width:100%;border-radius:20px;padding:5px;background:linear-gradient(135deg,var(--ags),transparent 50%,var(--ags));box-shadow:0 0 60px -10px var(--ag),0 20px 50px -20px rgba(0,0,0,.7)}
#gameWrapper{position:relative;width:100%;border-radius:16px;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--fb);border-radius:14px;image-rendering:pixelated}
.hint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.74rem;color:var(--td);margin-top:10px;text-align:center;flex-wrap:wrap}
.hint kbd{display:inline-block;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid var(--pbd);font-family:inherit;font-size:.66rem;font-weight:700;color:var(--t)}
.mode-indicator{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;background:var(--ags);border:1px solid var(--a);color:var(--a);font-weight:700;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase}
.dpad{display:none;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;width:190px}
.dpad button{width:58px;height:58px;border-radius:18px;border:1.5px solid var(--pbd);background:var(--pb);backdrop-filter:blur(10px);color:var(--t);font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;touch-action:manipulation;font-family:inherit;padding:0;margin:0 auto}
.dpad button:active{background:var(--a);color:#000;border-color:var(--a);transform:scale(.9);box-shadow:0 0 24px var(--ag)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.gameover-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border-radius:14px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:10}
.gameover-overlay.active{display:flex;animation:scrIn .4s}
.gameover-overlay .skull{font-size:2.6rem;margin-bottom:4px}
.gameover-overlay h2{font-size:1.5rem;margin-bottom:12px;color:#ff4466;text-shadow:0 0 30px rgba(255,68,102,.8)}
.gameover-overlay .final-score{font-size:.84rem;color:var(--td);margin-bottom:6px;letter-spacing:2px;text-transform:uppercase}
.gameover-overlay .final-score-num{font-size:2.4rem;font-weight:900;color:var(--a);text-shadow:0 0 30px var(--ag);margin-bottom:6px;line-height:1}
